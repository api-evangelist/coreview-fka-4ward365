apis:
- name: CoreView Public API
  description: >-
    The CoreView Public API provides programmatic access to Microsoft 365
    governance operations — delegated administration, operators, platform
    reporting, license pools, and customer/tenant management — via a regional
    API proxy. It is secured with OAuth 2.0 / OpenID Connect using the
    client-credentials grant against the CoreView IdentityServer, with
    fine-grained scopes (delegation, operator, platform, licensepool, license,
    customer). A companion CoreFlow Workflow API triggers and monitors
    automation runs.
