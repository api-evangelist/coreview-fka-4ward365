aid: coreview-fka-4ward365
name: CoreView (FKA 4ward365)
description: >-
  CoreView (formerly 4ward365) is an enterprise Microsoft 365 governance,
  security, and automation platform. It secures the configuration, identity,
  and access layers of Microsoft 365 tenants and provides delegated
  administration, license management, reporting, and workflow automation.
  CoreView exposes a Public API secured with OAuth 2.0 / OpenID Connect
  (client-credentials flow) through a regional API proxy, plus a CoreFlow
  Workflow API for triggering and monitoring automation runs. Datacenters are
  available across the EU, East US, Canada, UK, Australia, and US Government
  (FedRAMP) regions. This profile was surfaced as a portfolio company of
  Insight Partners and enriched from CoreView's public developer documentation.
